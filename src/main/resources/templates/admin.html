<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments :: head('Admin Dashboard')}"></head>
<body class="bg-light">
<div th:replace="~{fragments :: header}"></div>

<main class="container mt-3">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
        <h3 class="mb-0"><i class="bi bi-speedometer2"></i> Admin Dashboard</h3>
        <div class="d-flex gap-2">
            <button class="btn btn-primary" type="button" id="btnAdd"><i class="bi bi-plus-lg"></i> Add Product</button>
            <a class="btn btn-outline-secondary" th:href="@{/logout}">Logout</a>
        </div>
    </div>

    <div class="row g-3 mb-4">
        <div class="col-md-4"><div class="stat-card"><i class="bi bi-box-seam"></i><div><div class="stat-num" th:text="${totalProducts}">0</div><div class="text-muted small">Total products</div></div></div></div>
        <div class="col-md-4"><div class="stat-card"><i class="bi bi-boxes"></i><div><div class="stat-num" th:text="${totalStock}">0</div><div class="text-muted small">Total available stock</div></div></div></div>
        <div class="col-md-4"><div class="stat-card"><i class="bi bi-cart-check"></i><div><div class="stat-num" th:text="${cartEntries}">0</div><div class="text-muted small">Total cart entries</div></div></div></div>
    </div>

    <div class="card shadow-sm">
        <div class="card-header bg-white fw-semibold">Product Inventory</div>
        <div class="table-responsive">
            <table class="table align-middle mb-0">
                <thead class="table-light"><tr><th>ID</th><th>Image</th><th>Name</th><th>Category</th><th>Price</th><th style="width:190px">Stock</th><th class="text-end">Actions</th></tr></thead>
                <tbody>
                <tr th:each="p : ${products}">
                    <td th:text="${p.id}">1</td>
                    <td><img th:src="${p.imageUrl}" alt="" class="thumb" onerror="imgFallback(this)"></td>
                    <td th:text="${p.name}">Name</td>
                    <td th:text="${p.category}">Cat</td>
                    <td th:text="${@fmt.inr(p.price)}">₹0</td>
                    <td>
                        <div class="input-group input-group-sm">
                            <input type="number" min="0" class="form-control" th:id="'stock-' + ${p.id}" th:value="${p.stock}">
                            <button class="btn btn-outline-success" type="button" th:attr="data-stock=${p.id}">Update</button>
                        </div>
                    </td>
                    <td class="text-end text-nowrap">
                        <button class="btn btn-sm btn-outline-primary" type="button"
                                th:attr="data-edit=${p.id},data-name=${p.name},data-category=${p.category},data-description=${p.description},data-price=${p.price},data-qty=${p.stock},data-image=${p.imageUrl}"><i class="bi bi-pencil"></i> Edit</button>
                        <button class="btn btn-sm btn-outline-danger" type="button" th:attr="data-delete=${p.id},data-name=${p.name}"><i class="bi bi-trash"></i> Delete</button>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<!-- Add / Edit modal -->
<div class="modal fade" id="productModal" tabindex="-1">
    <div class="modal-dialog modal-lg"><div class="modal-content">
        <div class="modal-header"><h5 class="modal-title" id="modalTitle">Add Product</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
            <div id="formError" class="alert alert-danger d-none"></div>
            <input type="hidden" id="pId">
            <div class="row g-3">
                <div class="col-md-8"><label class="form-label">Name *</label><input id="pName" class="form-control" maxlength="150"></div>
                <div class="col-md-4"><label class="form-label">Category *</label>
                    <select id="pCategory" class="form-select"><option th:each="c : ${categories}" th:value="${c}" th:text="${c}"></option></select></div>
                <div class="col-md-4"><label class="form-label">Price (₹) *</label><input id="pPrice" type="number" min="0.01" step="0.01" class="form-control"></div>
                <div class="col-md-4"><label class="form-label">Stock *</label><input id="pStock" type="number" min="0" step="1" class="form-control"></div>
                <div class="col-md-4"><label class="form-label">Image URL</label><input id="pImage" class="form-control" placeholder="https://..."></div>
                <div class="col-12"><label class="form-label">Description</label><textarea id="pDescription" rows="3" class="form-control"></textarea></div>
            </div>
        </div>
        <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary" id="btnSave">Save</button></div>
    </div></div>
</div>

<div th:replace="~{fragments :: scripts}"></div>
<script th:src="@{/js/admin.js}"></script>
</body>
</html>
