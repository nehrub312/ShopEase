<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments :: head('Products')}"></head>
<body>
<div th:replace="~{fragments :: header}"></div>

<main class="container mt-3">
    <div class="row g-3">
        <aside class="col-lg-3">
            <form class="filter-box" th:action="@{/products}" method="get">
                <h6 class="mb-3"><i class="bi bi-funnel"></i> Filters</h6>
                <label class="form-label small">Search by name</label>
                <input type="text" name="name" class="form-control mb-3" th:value="${fName}" placeholder="e.g. laptop">
                <label class="form-label small">Category</label>
                <select name="category" class="form-select mb-3">
                    <option value="">All categories</option>
                    <option th:each="c : ${categories}" th:value="${c}" th:text="${c}" th:selected="${c == fCategory}"></option>
                </select>
                <div class="row g-2 mb-3">
                    <div class="col-6"><label class="form-label small">Min price (₹)</label>
                        <input type="number" min="0" step="1" name="minPrice" class="form-control" th:value="${fMin}"></div>
                    <div class="col-6"><label class="form-label small">Max price (₹)</label>
                        <input type="number" min="0" step="1" name="maxPrice" class="form-control" th:value="${fMax}"></div>
                </div>
                <label class="form-label small">Sort by</label>
                <select name="sort" class="form-select mb-3">
                    <option value="">Relevance</option>
                    <option value="price_asc" th:selected="${fSort == 'price_asc'}">Price: Low to High</option>
                    <option value="price_desc" th:selected="${fSort == 'price_desc'}">Price: High to Low</option>
                </select>
                <div class="d-grid gap-2">
                    <button class="btn btn-primary" type="submit">Apply Filters</button>
                    <a class="btn btn-outline-secondary" th:href="@{/products}">Clear Filters</a>
                </div>
            </form>
        </aside>
        <section class="col-lg-9">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 class="mb-0" th:text="${fCategory != null and !fCategory.isEmpty()} ? ${fCategory} : 'All Products'">All Products</h4>
                <span class="text-muted small" th:text="${#lists.size(products)} + ' result(s)'">0 results</span>
            </div>
            <div class="row g-3" th:if="${!products.isEmpty()}">
                <th:block th:each="p : ${products}"><div th:replace="~{fragments :: productCard(${p})}"></div></th:block>
            </div>
            <div class="empty-state" th:if="${products.isEmpty()}">
                <i class="bi bi-search"></i>
                <h5>No products found</h5>
                <p>Try changing or clearing your filters.</p>
                <a class="btn btn-primary" th:href="@{/products}">Clear Filters</a>
            </div>
        </section>
    </div>
</main>

<div th:replace="~{fragments :: footer}"></div>
<div th:replace="~{fragments :: scripts}"></div>
</body>
</html>
