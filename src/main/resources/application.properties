spring.application.name=ShopEase
server.port=8080

# ---- DEFAULT: embedded H2 database (MySQL-compatible mode), saved in ./data/ ----
# Runs with a single command, no database install needed:   mvn spring-boot:run
# To use real MySQL instead:   mvn spring-boot:run "-Dspring-boot.run.profiles=mysql"   (see application-mysql.properties)
spring.datasource.url=jdbc:h2:file:./data/shopease;MODE=MySQL;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.thymeleaf.cache=false

# Never show stack traces / internal messages to customers
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false

# Admin password (override with ADMIN_PASSWORD environment variable)
shopease.admin.password=${ADMIN_PASSWORD:admin123}
